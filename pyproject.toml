[project]
name = "mtah-possession"
version = "0.1.0"
description = "More than a Hack 2027 Phase 1: per-frame ball possession (H/A/D) from automatic tracking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "lightgbm>=4.7.0",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: bench acceptance gates on DFL (needs data and held-out models): pytest -m slow"]
addopts = "-m 'not slow'"
